<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ProTrack India — Sports Analytics</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            display: ['Plus Jakarta Sans', 'sans-serif'],
            body: ['Inter', 'sans-serif'],
          }
        }
      }
    };
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,153,51,.32); border-radius: 2px; }

    body {
      background: #09090e;
      font-family: 'Inter', sans-serif;
      color: #eeeef4;
      overflow-x: hidden;
      margin: 0;
    }

    /* ── NAVBAR ── */
    .navbar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100; height: 62px;
      background: rgba(9,9,14,.72);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      border-bottom: 1px solid rgba(255,255,255,.057);
    }
    .navbar-inner {
      max-width: 1300px; margin: 0 auto; padding: 0 24px;
      height: 100%; display: flex; align-items: center; justify-content: space-between;
    }
    .logo-mark {
      width: 34px; height: 34px; border-radius: 10px; flex-shrink: 0;
      background: linear-gradient(135deg, #ff9933 0%, #e67300 100%);
      display: flex; align-items: center; justify-content: center;
    }
    .logo-text { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 16.5px; }

    /* ── NAV PILL ── */
    .desktop-nav { position: relative; display: flex; align-items: center; gap: 2px; }
    .nav-pill {
      position: absolute; bottom: -1px; height: 2px;
      background: linear-gradient(90deg, #ff9933, #ffb347);
      border-radius: 2px 2px 0 0;
      transition: left .32s cubic-bezier(.4,0,.2,1), width .32s cubic-bezier(.4,0,.2,1);
      pointer-events: none;
    }
    .nav-link {
      padding: 8px 15px; font-size: 13.5px; font-weight: 500;
      color: #50506a; border-radius: 8px; cursor: pointer;
      transition: color .2s ease; user-select: none;
    }
    .nav-link:hover { color: #c4c4d8; }
    .nav-link.active { color: #ff9933; }

    /* ── MOBILE NAV ── */
    #mobileNavBtn { display: none; }
    @media (max-width: 768px) {
      #mobileNavBtn { display: flex; }
      .desktop-nav { display: none !important; }
      .add-athlete-nav-btn { display: none !important; }
    }

    /* ── DRAWER ── */
    .drawer-backdrop {
      display: none; position: fixed; inset: 0; z-index: 200;
      background: rgba(0,0,0,.62); backdrop-filter: blur(5px);
    }
    .drawer-backdrop.open { display: block; }
    .drawer-panel {
      position: fixed; top: 0; left: 0; bottom: 0; width: 268px; z-index: 201;
      background: #10101a; border-right: 1px solid rgba(255,255,255,.07);
      padding: 22px 18px;
      transform: translateX(-100%);
      transition: transform .28s cubic-bezier(.4,0,.2,1);
    }
    .drawer-backdrop.open .drawer-panel { transform: translateX(0); }
    .drawer-link {
      display: flex; align-items: center; gap: 10px; padding: 10px 12px;
      border-radius: 10px; font-size: 13.5px; font-weight: 500; cursor: pointer;
      color: #50506a; transition: all .18s ease; margin-bottom: 2px;
    }
    .drawer-link:hover { background: rgba(255,255,255,.05); color: #d0d0e0; }
    .drawer-link.active { background: rgba(255,153,51,.1); color: #ff9933; }

    /* ── PAGE ── */
    .page { animation: fadein .22s cubic-bezier(.4,0,.2,1); }
    @keyframes fadein {
      from { opacity: 0; transform: translateY(9px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── SURFACE LAYERS ── */
    .card {
      background: #10101a;
      border: 1px solid rgba(255,255,255,.057);
      border-radius: 16px;
      transition: border-color .28s ease, box-shadow .28s ease, transform .28s cubic-bezier(.4,0,.2,1);
    }
    .card:hover {
      border-color: rgba(255,153,51,.2);
      box-shadow: 0 8px 32px rgba(0,0,0,.44), 0 0 0 1px rgba(255,153,51,.08);
      transform: translateY(-2px);
    }
    .card-nohover { background: #10101a; border: 1px solid rgba(255,255,255,.057); border-radius: 16px; }

    /* ── KPI CARD ── */
    .kpi-card {
      background: linear-gradient(145deg, #10101a 0%, #16162a 100%);
      border: 1px solid rgba(255,255,255,.057);
      border-radius: 16px; overflow: hidden; position: relative;
      transition: all .3s cubic-bezier(.4,0,.2,1);
    }
    .kpi-card::before {
      content: ''; position: absolute; top: -28px; right: -28px;
      width: 110px; height: 110px; border-radius: 50%;
      background: radial-gradient(circle, rgba(255,153,51,.07) 0%, transparent 70%);
    }
    .kpi-card:hover {
      border-color: rgba(255,153,51,.22);
      box-shadow: 0 10px 38px rgba(0,0,0,.5), 0 0 26px rgba(255,153,51,.04);
      transform: translateY(-3px);
    }

    /* ── ATHLETE CARD ── */
    .athlete-card {
      background: #10101a; border: 1px solid rgba(255,255,255,.057);
      border-radius: 16px; position: relative; overflow: hidden; cursor: pointer;
      transition: all .3s cubic-bezier(.4,0,.2,1);
    }
    .athlete-card::after {
      content: ''; position: absolute; inset: 0; border-radius: 16px;
      background: linear-gradient(135deg, rgba(255,153,51,.045) 0%, transparent 100%);
      opacity: 0; transition: opacity .28s ease;
    }
    .athlete-card:hover::after { opacity: 1; }
    .athlete-card:hover {
      border-color: rgba(255,153,51,.28);
      box-shadow: 0 14px 44px rgba(0,0,0,.55), 0 0 0 1px rgba(255,153,51,.1);
      transform: translateY(-4px);
    }

    /* ── BUTTONS ── */
    .btn-primary {
      background: linear-gradient(135deg, #ff9933, #e67300);
      color: #09090e; font-weight: 700; font-size: 13.5px;
      border-radius: 10px; padding: 9px 18px; border: none; cursor: pointer;
      display: inline-flex; align-items: center; gap: 6px;
      transition: all .2s ease;
    }
    .btn-primary:hover { box-shadow: 0 0 24px rgba(255,153,51,.38); transform: translateY(-1px); }
    .btn-primary:active { transform: translateY(0); box-shadow: none; }

    .btn-ghost {
      background: rgba(255,255,255,.055); color: #9090a8; font-weight: 500; font-size: 13.5px;
      border-radius: 10px; padding: 9px 18px; border: 1px solid rgba(255,255,255,.08);
      cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
      transition: all .18s ease;
    }
    .btn-ghost:hover { background: rgba(255,255,255,.09); color: #eeeef4; }

    /* ── INPUT ── */
    .input-field {
      background: #181828; border: 1px solid rgba(255,255,255,.09);
      border-radius: 10px; color: #eeeef4; padding: 10px 14px;
      font-size: 13.5px; font-family: 'Inter', sans-serif; transition: all .2s ease;
      outline: none; width: 100%;
    }
    .input-field:focus { border-color: rgba(255,153,51,.52); box-shadow: 0 0 0 3px rgba(255,153,51,.08); }
    .input-field::placeholder { color: #323248; }
    .input-field option { background: #181828; }
    .input-error { border-color: rgba(239,68,68,.5) !important; box-shadow: 0 0 0 3px rgba(239,68,68,.07) !important; }

    /* ── FILTER BUTTONS ── */
    .filter-btn {
      padding: 6px 13px; border-radius: 8px; font-size: 12.5px; font-weight: 500;
      cursor: pointer; border: 1px solid transparent; white-space: nowrap;
      transition: all .18s ease;
    }
    .filter-btn.active { background: rgba(255,153,51,.13); color: #ff9933; border-color: rgba(255,153,51,.28); }
    .filter-btn:not(.active) { color: #50506a; background: transparent; }
    .filter-btn:not(.active):hover { color: #a0a0b8; background: rgba(255,255,255,.04); }

    /* ── PROGRESS BAR ── */
    .progress-track { height: 5px; background: rgba(255,255,255,.05); border-radius: 3px; overflow: hidden; }
    .progress-fill  { height: 100%; border-radius: 3px; transition: width 1s cubic-bezier(.4,0,.2,1); }

    /* ── SKELETON ── */
    .skeleton {
      background: linear-gradient(90deg, #181828 25%, #1e1e30 50%, #181828 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite; border-radius: 14px;
    }
    @keyframes shimmer {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* ── TOAST ── */
    #toastContainer {
      position: fixed; top: 22px; right: 22px; z-index: 9999;
      display: flex; flex-direction: column; gap: 8px; pointer-events: none;
    }
    .toast {
      padding: 12px 18px; border-radius: 12px; font-size: 13.5px; font-weight: 500;
      display: flex; align-items: center; gap: 10px; min-width: 255px;
      pointer-events: auto; box-shadow: 0 8px 32px rgba(0,0,0,.55);
      animation: toastIn .32s cubic-bezier(.34,1.56,.64,1);
    }
    @keyframes toastIn {
      from { opacity: 0; transform: translateX(110%); }
      to   { opacity: 1; transform: translateX(0); }
    }
    .toast.success { background: rgba(34,197,94,.11); border: 1px solid rgba(34,197,94,.27); color: #4ade80; }
    .toast.error   { background: rgba(239,68,68,.11);  border: 1px solid rgba(239,68,68,.27);  color: #f87171; }
    .toast.info    { background: rgba(255,153,51,.11); border: 1px solid rgba(255,153,51,.27); color: #ffb347; }

    /* ── BADGES ── */
    .rising-star {
      background: rgba(255,153,51,.16); border: 1px solid rgba(255,153,51,.35);
      color: #ff9933; font-size: 10px; font-weight: 700;
      padding: 2px 8px; border-radius: 20px; letter-spacing: .4px; white-space: nowrap;
    }
    .sport-badge { font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 20px; display: inline-block; }
    .rank-1 { background: linear-gradient(135deg,#ffd700,#ffa000); color: #09090e; }
    .rank-2 { background: linear-gradient(135deg,#c0c0c0,#909090); color: #09090e; }
    .rank-3 { background: linear-gradient(135deg,#cd7f32,#a65e1a); color: #fff; }
    .trend-up   { color: #22c55e; }
    .trend-down { color: #ef4444; }
    .trend-neutral { color: #60607a; }

    /* ── LEADERBOARD ── */
    .lb-row {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 13px; border-radius: 12px;
      border: 1px solid transparent;
      transition: background .18s ease; cursor: pointer;
    }
    .lb-row:hover { background: rgba(255,255,255,.04); }
    .lb-row.t1 { background: rgba(255,215,0,.04);   border-color: rgba(255,215,0,.1);  margin-bottom: 3px; }
    .lb-row.t2 { background: rgba(200,200,200,.04); border-color: rgba(200,200,200,.08); margin-bottom: 3px; }
    .lb-row.t3 { background: rgba(205,127,50,.04);  border-color: rgba(205,127,50,.08); margin-bottom: 3px; }

    /* ── AVATAR ── */
    .avatar {
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-weight: 800; flex-shrink: 0;
    }
    .avatar-sq { border-radius: 14px; display: flex; align-items: center; justify-content: center; font-weight: 800; flex-shrink: 0; }

    /* ── FORM ERRORS ── */
    .field-error { color: #ef4444; font-size: 12px; margin-top: 4px; display: none; }
    .field-error.show { display: block; }

    /* ── PODIUM ── */
    .podium-card {
      background: #10101a; border: 1px solid rgba(255,255,255,.057);
      border-radius: 16px; display: flex; flex-direction: column;
      align-items: center; justify-content: flex-end;
      padding: 18px 14px; position: relative;
      transition: all .28s ease;
    }
    .podium-card.gold   { border-color: rgba(255,215,0,.2);  background: linear-gradient(175deg,rgba(255,215,0,.05) 0%,#10101a 55%); }
    .podium-card.silver { border-color: rgba(192,192,192,.15); }
    .podium-card.bronze { border-color: rgba(205,127,50,.15); }

    /* ── RESPONSIVE GRIDS ── */
    .kpi-grid         { display: grid; grid-template-columns: repeat(4,1fr); gap: 16px; }
    .athletes-grid    { display: grid; grid-template-columns: repeat(3,1fr); gap: 18px; }
    .dash-charts      { display: grid; grid-template-columns: 3fr 2fr; gap: 18px; }
    .analytics-top    { display: grid; grid-template-columns: 1fr 2fr; gap: 18px; }
    .analytics-bottom { display: grid; grid-template-columns: 2fr 1fr; gap: 18px; }
    .podium-grid      { display: grid; grid-template-columns: 1fr 1.12fr 1fr; gap: 14px; }
    .form-row         { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }

    @media (max-width: 1100px) { .kpi-grid { grid-template-columns: repeat(2,1fr); } }
    @media (max-width: 580px)  { .kpi-grid { grid-template-columns: 1fr; } .form-row { grid-template-columns: 1fr; } }
    @media (max-width: 1050px) { .athletes-grid { grid-template-columns: repeat(2,1fr); } }
    @media (max-width: 620px)  { .athletes-grid { grid-template-columns: 1fr; } }
    @media (max-width: 940px)  { .dash-charts { grid-template-columns: 1fr; } }
    @media (max-width: 880px)  { .analytics-top { grid-template-columns: 1fr; } .analytics-bottom { grid-template-columns: 1fr; } }
    @media (max-width: 560px)  { .podium-grid { grid-template-columns: 1fr; } }

    input[type=range] { accent-color: #ff9933; }
    .empty-icon { width: 58px; height: 58px; background: rgba(255,153,51,.1); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 14px; font-size: 24px; }
  </style>
</head>

// ── COUNTER ANIMATION ───────────────────────────────────────────────────────
function countUp(el,target,ms){
  ms=ms||900;
  var t0=performance.now();
  (function tick(now){
    var p=Math.min((now-t0)/ms,1), ease=1-Math.pow(1-p,3);
    el.textContent=Math.round(target*ease);
    if(p<1) requestAnimationFrame(tick);
  })(performance.now());
}

// ── SPARKLINE ───────────────────────────────────────────────────────────────
function sparkline(id,data,color){
  var c=document.getElementById(id); if(!c) return;
  var ctx=c.getContext('2d'),W=c.width,H=c.height;
  var mn=Math.min.apply(null,data),mx=Math.max.apply(null,data),rng=mx-mn||1;
  var pts=data.map(function(v,i){return{x:(i/(data.length-1))*W,y:H-((v-mn)/rng)*(H-4)-2};});
  ctx.clearRect(0,0,W,H);
  ctx.beginPath();
  pts.forEach(function(p,i){i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y);});
  ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.closePath();
  ctx.fillStyle=color+'1f';ctx.fill();
  ctx.beginPath();
  pts.forEach(function(p,i){i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y);});
  ctx.strokeStyle=color;ctx.lineWidth=1.6;ctx.lineJoin='round';ctx.stroke();
}

// ── GAUGE ───────────────────────────────────────────────────────────────────
function gauge(canvas,val,max){
  var ctx=canvas.getContext('2d'),cx=canvas.width/2,cy=canvas.height/2+8;
  var r=72,lw=13,sA=Math.PI*.75,eA=Math.PI*2.25,tA=eA-sA;
  var pct=val/max,col=val>=85?['#ff9933','#ffb347']:val>=70?['#3b82f6','#60a5fa']:['#6b7280','#9ca3af'];
  var t0=performance.now(),dur=1250;
  (function frame(now){
    var p=Math.min((now-t0)/dur,1),ease=1-Math.pow(1-p,3),ap=ease*pct;
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.beginPath();ctx.arc(cx,cy,r,sA,eA);
    ctx.strokeStyle='rgba(255,255,255,.056)';ctx.lineWidth=lw;ctx.lineCap='round';ctx.stroke();
    if(ap>.002){
      ctx.beginPath();ctx.arc(cx,cy,r,sA,sA+tA*ap);
      var g=ctx.createLinearGradient(cx-r,cy,cx+r,cy);
      g.addColorStop(0,col[0]);g.addColorStop(1,col[1]);
      ctx.strokeStyle=g;ctx.lineWidth=lw;ctx.lineCap='round';ctx.stroke();
    }
    if(p<1) requestAnimationFrame(frame);
  })(performance.now());
}

function verifyAthlete(id){
  let a = athletes.find(x => x.id == id);
  if(!a) return;

  a.verified = true;

  a.coach = {
    name: currentUser.name || "Coach",
    phone: currentUser.phone || "N/A",
    state: currentUser.state || "N/A"
  };

  nav('athletes');
  toast("Athlete verified", "success");
}
function showCoachDetails(id){
  let a = athletes.find(x => x.id == id);
  if(!a || !a.coach) return;

  alert(
    "Verified by Coach\n\n" +
    "Name: " + a.coach.name + "\n" +
    "State: " + a.coach.state + "\n" +
    "Phone: " + a.coach.phone
  );
}

function setSportFilter(s){sportFilter=s;nav('athletes');}

function searchAthletes(q){
  var allS=sorted();
  var pool=sportFilter==='All'?allS:allS.filter(function(a){return a.sport===sportFilter;});
  var lo=q.toLowerCase();
  var res=q?pool.filter(function(a){return a.name.toLowerCase().indexOf(lo)>-1||a.sport.toLowerCase().indexOf(lo)>-1||a.state.toLowerCase().indexOf(lo)>-1;}):pool;
  var grid=document.getElementById('athletesGrid');if(!grid)return;
  grid.innerHTML=res.length===0
    ?'<div style="grid-column:1/-1;"><div class="card" style="padding:56px 32px;text-align:center;"><div class="empty-icon">🔍</div><div style="font-family:\'Plus Jakarta Sans\',sans-serif;font-weight:700;font-size:17px;color:#eeeef4;margin-bottom:8px;">No results for "'+q+'"</div><p style="color:#50506a;font-size:13.5px;margin:0;">Try a different name or sport</p></div></div>'
    :res.map(function(a){return athleteCard(a,allS.indexOf(a)+1);}).join('');
}

function clearFErr(key){
  var f=document.getElementById({'fn':'fname','fa':'fage','fs':'fsport','fst':'fstate'}[key]||key);
  var e=document.getElementById('err-'+key);
  if(f) f.classList.remove('input-error');
  if(e) e.classList.remove('show');
}

function submitAthlete(e){
  e.preventDefault();
  var name=(document.getElementById('fname')||{}).value||'';
  var ageV=(document.getElementById('fage')||{}).value||'';
  var sport=(document.getElementById('fsport')||{}).value||'';
  var state=(document.getElementById('fstate')||{}).value||'';
  var score=parseInt((document.getElementById('fscore')||{}).value||70);
  var medals=parseInt((document.getElementById('fmedals')||{}).value||0)||0;
  var age=parseInt(ageV);
  var ok=true;
  if(!name.trim()){markFErr('fname','fn');ok=false;}
  if(!ageV||age<14||age>45||isNaN(age)){markFErr('fage','fa');ok=false;}
  if(!sport){markFErr('fsport','fs');ok=false;}
  if(!state.trim()){markFErr('fstate','fst');ok=false;}
  if(!ok){toast('Please fix the errors above','error');return;}
  var base=Math.max(10,score-18);
  athletes.push({
    id:athletes.length+1,name:name.trim(),sport,age,state:state.trim(),score,medals,
    trend:0,active:true,
    history:Array.from({length:8},function(_,i){return Math.round(base+(score-base)*(i/7));})
  });
  toast(name.trim()+' registered successfully!','success');
  setTimeout(function(){nav('athletes');},600);
}

function markFErr(fid,key){
  var f=document.getElementById(fid),e=document.getElementById('err-'+key);
  if(f) f.classList.add('input-error');
  if(e) e.classList.add('show');
}

// ── SHARED: PAGE HEADER ─────────────────────────────────────────────────────
function pageHeader(title,sub,right){
  return '<div style="display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:28px;">'+
    '<div>'+
      '<h1 style="font-family:\'Plus Jakarta Sans\',sans-serif;font-weight:800;font-size:28px;color:#eeeef4;margin:0 0 4px;">'+title+'</h1>'+
      '<p style="color:#50506a;font-size:13.5px;margin:0;">'+sub+'</p>'+
    '</div>'+
    (right?'<div>'+right+'</div>':'')+

// ── INIT ────────────────────────────────────────────────────────────────────
window.addEventListener('load',function(){
  setTimeout(function(){
    var sk=document.getElementById('loadingSkeleton');
    if(sk) sk.remove();
    nav('dashboard');
    updateLoginButton();
  },80);
});
let isLoggedIn = false;

function openLogin(){
  document.getElementById("loginModal").style.display = "flex";
}

function closeLogin(){
  document.getElementById("loginModal").style.display = "none";
}

function login(){
  let user = document.getElementById("loginUser").value;
  let pass = document.getElementById("loginPass").value;

  if(USERS[user] && USERS[user].password === pass){

  currentUser = USERS[user];
  isAdminLoggedIn = (currentUser.role === "admin");

  closeLogin();

  // 🔥 FORCE UI UPDATE
  nav('athletes');   // re-render page
  updateLoginButton();

  toast("Login successful (" + currentUser.role + ")", "success");

} else {
  toast("Invalid credentials", "error");
}
}

function logout(){
  isAdminLoggedIn = false;
  updateLoginButton();
  toast("Logged out", "info");
}

function updateLoginButton(){
  let btn = document.getElementById("loginBtn");
  if(!btn) return;

  if(currentUser){
    btn.innerText = "Logout";
    btn.onclick = logout;
  } else {
    btn.innerText = "Login";
    btn.onclick = openLogin;
  }
}
function handleAddAthlete(){
  if(!isAdminLoggedIn){
    toast("Login as admin to add athlete", "error");
    return;
  }
  nav('add');
}
window.verifyAthlete = verifyAthlete;
window.showCoachDetails = showCoachDetails;
</script>
<div id="loginModal" style="position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:999;">
  
  <div style="background:#111827;padding:24px;border-radius:12px;width:300px;box-shadow:0 10px 30px rgba(0,0,0,.5);">
    
    <h3 style="margin-bottom:15px;">Login</h3>

    <input id="loginUser" placeholder="Username" style="width:100%;padding:8px;margin-bottom:10px;border-radius:6px;background:#1f2937;color:white;border:none;">
    
    <input id="loginPass" type="password" placeholder="Password" style="width:100%;padding:8px;margin-bottom:15px;border-radius:6px;background:#1f2937;color:white;border:none;">

    <div style="display:flex;gap:10px;">
      <button onclick="login()" class="btn-primary" style="flex:1;">Login</button>
      <button onclick="closeLogin()" style="flex:1;">Cancel</button>
    </div>

  </div>
</div>
